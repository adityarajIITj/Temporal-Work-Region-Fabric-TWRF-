name: TWRF Validation

on:
  push:
    branches:
      - research/p0-semantic-hardening
      - twrf-doom
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - twrf-doom

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install matplotlib pillow

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke demo
        run: ./build/twrf_demo > /tmp/twrf_demo.log

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          with open("results/phase3_sweeps.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert len(data["change_rate_sweep"]) == 7
          assert len(data["locality_sweep"]) == 2
          assert len(data["full_matrix"]) == 14
          for point in data["full_matrix"]:
              assert point["execution_set_parity"] is True
              assert point["output_parity"] is True
              assert point["twrf_dependency_audit_failures"] == 0
              assert point["baseline_c_dependency_audit_failures"] == 0
              for key in ("object_change_fraction", "dirty_region_fraction", "executed_region_fraction"):
                  assert 0.0 <= point[key] <= 1.0
          import math
          with open("results/twrf_sensitivity.json", "r", encoding="utf-8") as f:
              sensitivity = json.load(f)
          grid = sensitivity["sensitivity"]
          assert len(grid) == 135
          for point in grid:
              assert point["cases"] == 14
              assert 0.0 <= point["twrf_vs_c_win_fraction"] <= 1.0
              assert math.isfinite(point["min_twrf_vs_c_ratio"])
              assert math.isfinite(point["max_twrf_vs_c_ratio"])
              assert point["min_twrf_vs_c_ratio"] >= 0.0
              assert point["max_twrf_vs_c_ratio"] >= point["min_twrf_vs_c_ratio"]
          print("JSON research-gate validation passed")
          PY

      - name: Run DOOM TWRF Benchmark
        run: ./build/twrf_doom --bench

      - name: Run DOOM Analysis and Plotting
        run: python3 python/analysis/plot_doom_results.py

      - name: Validate DOOM Benchmark Output
        run: |
          python3 - <<'PY'
          import json
          with open("results/doom_twrf_benchmark.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert data["total_frames"] == 150
          assert data["tile_grid"]["total"] == 1000
          assert data["avg_skip_ratio"] > 0.35
          assert data["hud_reuse_ratio"] > 0.90
          assert data["speedup"] > 1.40
          print("DOOM benchmark validation passed successfully")
          PY

      - name: Upload experimental artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrf-research-results
          path: |
            results/phase3_sweeps.json
            results/break_even_curve.png
            results/twrf_sensitivity.json
            results/doom_twrf_benchmark.json
            results/doom_twrf_benchmark.png
            results/doom_frame*.png
          if-no-files-found: warn
